name: Export slide PDFs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: pdf-export
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y weasyprint poppler-utils
      - name: Select PDF diff base
        id: pdf-base
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base="$PUSH_BEFORE"
          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"
      - name: Export PDFs for changed decks
        run: node scripts/export-pdf.mjs --changed
        env:
          PDF_BASE_SHA: ${{ steps.pdf-base.outputs.sha }}
      - uses: actions/upload-artifact@v5
        with:
          name: slide-pdfs-${{ github.sha }}
          path: |
            decks/**/*.pdf
            decks/**/thumbnail.png
          if-no-files-found: warn
          retention-days: 14
