name: Deploy slides to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'decks/**'
      - 'design-system/**'
      - 'scripts/build-site.mjs'
      - 'scripts/build-tokens.mjs'
      - 'scripts/lib/deck.mjs'
      - 'scripts/lecture/build-variants.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'site.json'
      - 'external.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: node scripts/build-tokens.mjs
      - run: node scripts/build-site.mjs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
