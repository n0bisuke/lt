<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L11,6 L1,11 Z" fill="#263238"/></marker></defs>
<rect width="1920" height="1080" fill="#fff"/>
<style>text{font-family:'Noto Sans JP','Yu Gothic',sans-serif;fill:#202124}.title{font-size:48px;font-weight:700}.label{font-size:30px;font-weight:700}.small{font-size:22px;fill:#5f6368}.alias{font-size:29px;font-weight:700;fill:#087f8c}.site{font-size:30px;font-weight:700}.note{font-size:30px;font-weight:700}.caveat{font-size:20px;fill:#656b70}</style>
<text x="960" y="92" text-anchor="middle" class="title">登録先ごとにメールアドレスを分ける</text>
<text x="160" y="440" text-anchor="middle" class="label">自分のメール</text>
<text x="160" y="488" text-anchor="middle" class="small">（自分のメインメールなど）@gmail.com</text>
<text x="548" y="420" text-anchor="middle" class="label">エイリアスサービス</text>
<text x="548" y="460" text-anchor="middle" class="small">別名を発行して、受信メールを転送</text>
<path d="M300 510 H390" stroke="#263238" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<path d="M704 510 H790 V258 H880" stroke="#263238" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<path d="M790 418 H880" stroke="#263238" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<path d="M790 418 V578 H880" stroke="#263238" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<text x="900" y="267" text-anchor="start" class="alias">hoge@hoge.com</text>
<text x="900" y="427" text-anchor="start" class="alias">aaaa@hoge.com</text>
<text x="900" y="587" text-anchor="start" class="alias">teest@hoge.com</text>
<path d="M1190 258 H1420" stroke="#263238" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<path d="M1190 418 H1420" stroke="#263238" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<path d="M1190 578 H1420" stroke="#263238" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<text x="1490" y="268" class="site">登録先 A</text>
<text x="1490" y="428" class="site">登録先 B</text>
<text x="1490" y="588" class="site">登録先 C</text>
<text x="960" y="760" text-anchor="middle" class="small">登録先ごとに別のアドレスを使う。受信メールは同じ受信箱へ転送できる</text>
<rect x="1260" y="224" width="95" height="68" rx="8" fill="#fff"/>
<text x="1308" y="260" text-anchor="middle" font-size="54" font-weight="700" fill="#d32f2f">×</text>
<text x="1308" y="310" text-anchor="middle" font-size="21" font-weight="700" fill="#c62828">攻撃・漏えい</text>
<text x="960" y="815" text-anchor="middle" class="note">A用のアドレスが漏れても、B/C用と本来のメールは別</text>
<text x="960" y="862" text-anchor="middle" class="small">漏れたA用アドレスを停止・変更すれば、他への影響を抑えやすい</text>
<text x="960" y="920" text-anchor="middle" class="caveat">※ パスワードの使い回しや、他の情報の漏えいは別途注意</text>
</svg>