<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../design-system/tokens.css">
<link rel="stylesheet" href="../site.css">
<title>Jevでマイクロスリープ判定 - 菅原のびすけ</title>
<meta name="description" content="2026年9月20日 IoTLT @JLCPCB オープンハードカンファレンス">
<meta property="og:title" content="Jevでマイクロスリープ判定">
<meta property="og:description" content="2026年9月20日 IoTLT @JLCPCB オープンハードカンファレンス">
<meta property="og:type" content="article">
<meta property="og:url" content="https://n0bisuke.github.io/lt/20260920_jev-microsleep/">
<meta property="og:image" content="https://n0bisuke.github.io/lt/20260920_jev-microsleep/thumbnail.png">
<meta name="twitter:card" content="summary_large_image">
</head>
<body>
<main>
  <a class="site-head" href="../">
    <img src="../design-system/project/assets/Logos/nobisuke-avatar.jpg" alt="">
    <div><p class="site-name">LT スライド</p><p>菅原のびすけ @n0bisuke</p></div>
  </a>
  <article class="detail">
    <div class="player"><iframe src="slides/" title="Jevでマイクロスリープ判定" allowfullscreen></iframe></div>
    <div class="controls">
      <button class="btn" id="prev" type="button" aria-label="前のスライド">←</button>
      <span class="count" id="count" aria-live="polite">1 / 18</span>
      <button class="btn" id="next" type="button" aria-label="次のスライド">→</button>
      <div class="end">
        <button class="btn" id="full" type="button">全画面</button>
        <a class="btn" href="20260920_jev-microsleep.pdf" download>PDF</a>
      </div>
    </div>
    <h1>Jevでマイクロスリープ判定</h1>
    <p class="meta">2026年9月20日・18枚<br>発表イベント：<a href="https://iotlt.connpass.com/event/402832/">IoTLT @JLCPCB オープンハードカンファレンス</a></p>
  </article>
</main>
<script>
(function () {
  var frame = document.querySelector('iframe');
  var count = document.getElementById('count');
  var prev = document.getElementById('prev');
  var next = document.getElementById('next');
  var full = document.getElementById('full');
  function update() {
    var w = frame.contentWindow;
    var total = w.document.querySelectorAll('.lt-slide, svg[data-marpit-svg]').length;
    var at = parseInt(w.location.hash.slice(1), 10) || 1;
    count.textContent = at + ' / ' + total;
    prev.disabled = at <= 1;
    next.disabled = at >= total;
  }
  function go(key) {
    frame.contentWindow.dispatchEvent(new KeyboardEvent('keydown', { key: key }));
    update();
  }
  frame.addEventListener('load', function () {
    update();
    var w = frame.contentWindow;
    w.addEventListener('keydown', function () { setTimeout(update); });
    w.addEventListener('click', function () { setTimeout(update); });
  });
  prev.addEventListener('click', function () { go('ArrowLeft'); });
  next.addEventListener('click', function () { go('ArrowRight'); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); go(e.key); }
  });
  if (frame.requestFullscreen) {
    full.addEventListener('click', function () { frame.requestFullscreen().then(function () { frame.focus(); }); });
  } else {
    full.hidden = true;
  }
})();
</script>
</body>
</html>
